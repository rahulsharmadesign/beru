name: Release

# Two ways to publish:
# - push a version tag (v1.1.27), or
# - run this workflow by hand on main (Actions → Release → Run workflow). It tags
#   v<MARKETING_VERSION from project.yml> at the current commit, and refuses if
#   that tag already exists so an existing release is never overwritten.
# A manual run on any other branch only builds the DMG as a workflow artifact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            version=$(awk '/MARKETING_VERSION/ {print $2; exit}' project.yml | tr -d '"')
            tag="v${version}"
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
              echo "::error::${tag} already exists. Bump MARKETING_VERSION in project.yml before releasing."
              exit 1
            fi
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        env:
          BERU_SIGN_IDENTITY: "-"
        run: |
          chmod +x scripts/*.sh
          ./scripts/make-dmg.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Enhancify-dmg
          path: build/Enhancify-*.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/Enhancify-*.dmg
          generate_release_notes: true
